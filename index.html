    <style>
        :root {
            --primary-bg: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --bg-gradient: linear-gradient(135deg, #0a0f1e 0%, #071931 50%, #0d274c 100%);
            --wave-color1: rgba(56, 189, 248, 0.15);
            --wave-color2: rgba(2, 132, 199, 0.25);
            --sidebar-width: 260px;
        }

        /* ערכות נושא (Themes) */
        body.theme-purple {
            --card-bg: rgba(45, 27, 78, 0.65);
            --card-border: rgba(216, 180, 254, 0.2);
            --text-main: #faf5ff;
            --text-muted: #c084fc;
            --accent: #c084fc;
            --accent-hover: #a855f7;
            --bg-gradient: linear-gradient(135deg, #18092b 0%, #2a085c 50%, #4c1d95 100%);
            --wave-color1: rgba(192, 132, 252, 0.15);
            --wave-color2: rgba(168, 85, 247, 0.25);
        }

        body.theme-dark {
            --card-bg: rgba(24, 24, 27, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #a1a1aa;
            --accent-hover: #71717a;
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 50%, #27272a 100%);
            --wave-color1: rgba(255, 255, 255, 0.05);
            --wave-color2: rgba(255, 255, 255, 0.1);
        }

        body.theme-light {
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            --wave-color1: rgba(2, 132, 199, 0.15);
            --wave-color2: rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* גלילה מותאמת אישית מודרנית */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            opacity: 0.5;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* רקע גלים דינמי בדימוי ים וצורות נעות */
        .ocean-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeat-x;
            transform: translate3d(0, 0, 0);
        }

        .wave1 {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="%2338bdf8" opacity="0.25"></path></svg>');
            animation: waveAnim 14s linear infinite;
        }

        .wave2 {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C200,40 400,100 600,20 C800,-40 1000,80 1200,30 L1200,120 L0,120 Z" fill="%230284c7" opacity="0.2"></path></svg>');
            animation: waveAnim 9s linear infinite reverse;
        }

        @keyframes waveAnim {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* סרגל צד מתרחב (Sidebar) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
            position: relative;
        }

        [dir="ltr"] .sidebar {
            border-left: none;
            border-right: 1px solid var(--card-border);
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar-header {
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0.75rem;
            border: 1px dashed var(--accent);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        .sidebar-content {
            flex: 1;
            padding: 0 1rem 1rem 1rem;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1rem 0 0.5rem 0;
        }

        .history-item {
            padding: 0.7rem;
            border-radius: 0.6rem;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            margin-bottom: 0.3rem;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent);
            border-color: var(--card-border);
            transform: translateX(-3px);
        }

        [dir="ltr"] .history-item:hover {
            transform: translateX(3px);
        }

        /* מעטפת הראשית */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* ... existing code ... */

        /* סרגל עליון */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
        }

        .theme-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }

        /* ... existing code ... */

        /* אנימציות הודעה */
        .msg {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            line-height: 1.6;
            font-size: 0.95rem;

        @keyframes messagePop {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

    </style>
</head>

                    <span style="font-size:1.4rem">🌊</span> MatrixAI Copilot
                </div>

                <!-- בורר ערכות נושא (Themes) -->

                    <option value="ocean">🌊 אוקיינוס</option>
                    <option value="purple">🟣 סגול ניאון</option>
                    <option value="dark">⬛ כהה עתידני</option>
                    <option value="light">☀️ יום בהיר</option>
                </select>
                <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="he">עברית 🇮🇱</option>

                </select>
                <span class="user-badge" id="display-username">אורח</span>

<!-- ... existing code ... -->

    <script>
        const API_KEY = "bgs_live_1ee39ea97e4f175c2c6b4ac63490220f377d43775a56ac30";
        const API_BASE_URL = "https://birgsol-gh.davidyosef2102014.workers.dev/v1";

        let isSignUp = false;
        let currentUser = null;
        let activeChatHistory = [];
        let currentChatId = null; // זיהוי ייחודי לשיחה הנוכחית
        let currentLang = 'he';

        // ... existing code ...

        function changeTheme(themeName) {
            document.body.className = '';
            if (themeName !== 'ocean') {
                document.body.classList.add(`theme-${themeName}`);
            }
            localStorage.setItem('copilot_theme', themeName);
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('copilot_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                setupUserSession();
            }
            const savedTheme = localStorage.getItem('copilot_theme') || 'ocean';
            document.getElementById('theme-select').value = savedTheme;
            changeTheme(savedTheme);
            updateUI();
        };

        // ... existing code ...

        function loadUserChatsList() {
            if (!currentUser) return;
            const users = JSON.parse(localStorage.getItem('copilot_users') || '{}');
            const userChats = users[currentUser.username]?.chats || [];
            const container = document.getElementById('sidebar-chats-list');
            container.innerHTML = '';

            if (userChats.length === 0) {
                container.innerHTML = `<span style="color:var(--text-muted); font-size:0.85rem; padding:0.5rem; display:block;">${translations[currentLang].noChats}</span>`;
                return;
            }

            userChats.slice().reverse().forEach((chat) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.onclick = () => openSavedChat(chat);
                item.innerHTML = `<span>💬</span> <span>${chat.title}</span>`;
                container.appendChild(item);
            });
        }

        function createNewChat() {
            activeChatHistory = [];
            currentChatId = null;
            document.getElementById('chat-messages').innerHTML = '';
            showHome();
        }

        function startChatFromHome() {
            const text = document.getElementById('home-input').value.trim();
            if (!text) return;

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');

            activeChatHistory = [];
            currentChatId = Date.now().toString(); // מזהה ייחודי חדש
            document.getElementById('chat-messages').innerHTML = '';
            sendChatMessage(text);
        }

        function saveCurrentChat() {
            if (!currentUser || activeChatHistory.length === 0) return;

            const users = JSON.parse(localStorage.getItem('copilot_users') || '{}');
            if (!users[currentUser.username]) return;

            // מציאת ההודעה הראשונה של המשתמש ככותרת
            const firstUserMsg = activeChatHistory.find(m => m.role === 'user');
            const chatTitle = firstUserMsg ? (firstUserMsg.content.substring(0, 25) + '...') : 'שיחה חדשה';
            
            let userChats = users[currentUser.username].chats || [];
            
            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }

            const existingIndex = userChats.findIndex(c => c.id === currentChatId);

            if (existingIndex >= 0) {
                userChats[existingIndex].history = activeChatHistory;
                userChats[existingIndex].title = chatTitle;
            } else {
                userChats.push({
                    id: currentChatId,
                    title: chatTitle,
                    history: activeChatHistory
                });
            }

            users[currentUser.username].chats = userChats;
            localStorage.setItem('copilot_users', JSON.stringify(users));
            loadUserChatsList(); // רענון סרגל הצד באופן מיידי!
        }

        function openSavedChat(chat) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');

            activeChatHistory = chat.history;
            currentChatId = chat.id || Date.now().toString();
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            activeChatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    appendMessage(msg.content, 'user-msg');
                } else {
                    appendMessage(msg.content, 'ai-msg');
                }
            });
        }
    </script>
