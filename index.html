<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixAI Copilot</title>
    <style>
        :root {
            --primary-bg: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* גלילה מותאמת אישית מודרנית */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.6);
        }

        body {
            background: linear-gradient(rgba(10, 15, 30, 0.75), rgba(10, 15, 30, 0.85)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* סרגל צד מתרחב (Sidebar) */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 900;
            position: relative;
        }

        [dir="ltr"] .sidebar {
            border-left: none;
            border-right: 1px solid var(--card-border);
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar-header {
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0.75rem;
            border: 1px dashed var(--accent);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .sidebar-content {
            flex: 1;
            padding: 0 1rem 1rem 1rem;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1rem 0 0.5rem 0;
        }

        .history-item {
            padding: 0.7rem;
            border-radius: 0.6rem;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
            margin-bottom: 0.3rem;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent);
        }

        /* מעטפת הראשית */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* מסכי התחברות והרשמה */
        .auth-container {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-btn:hover {
            background: #7dd3fc;
        }

        .auth-toggle {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-toggle span {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }

        /* סרגל עליון */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sidebar-toggle-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 0.4rem 0.7rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .lang-select {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            outline: none;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            border: 1px solid var(--card-border);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* תוכן מרכזי */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .greeting {
            text-align: center;
            margin-bottom: 2rem;
        }

        .greeting h1 {
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .greeting h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* תיבת קלט ראשית */
        .search-box-container {
            width: 100%;
            max-width: 720px;
            background: rgba(23, 32, 54, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.75rem;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .search-box-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 1rem;
        }

        .search-box-input::placeholder {
            color: var(--text-muted);
        }

        .search-box-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-response-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-response-badge:hover {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .search-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .icon-btn {
            background: var(--accent);
            border: none;
            color: #0f172a;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #7dd3fc;
            transform: scale(1.05);
        }

        /* הצעות מהירות */
        .suggestions-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .chip {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* מסך שיחה פעילה */
        .chat-active-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
            padding: 1.5rem 1rem;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
        }

        .msg {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .user-msg {
            align-self: flex-start;
            background: var(--accent);
            color: #0f172a;
            border-top-right-radius: 0.2rem;
            font-weight: 500;
        }

        [dir="ltr"] .user-msg {
            align-self: flex-end;
            border-top-right-radius: 1.25rem;
            border-top-left-radius: 0.2rem;
        }

        .ai-msg {
            align-self: flex-end;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: white;
            border-top-left-radius: 0.2rem;
        }

        [dir="ltr"] .ai-msg {
            align-self: flex-start;
            border-top-left-radius: 1.25rem;
            border-top-right-radius: 0.2rem;
        }

        .msg img {
            max-width: 100%;
            border-radius: 0.75rem;
            margin-top: 0.8rem;
            display: block;
            border: 1px solid var(--card-border);
        }

        .download-btn {
            display: inline-block;
            margin-top: 0.6rem;
            background: var(--accent);
            color: #0f172a;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #7dd3fc;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- סרגל צד (Sidebar) -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo" style="font-size:1rem">
                <span>🌊</span> MatrixAI
            </div>
            <button class="sidebar-toggle-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div style="padding: 0 1rem;">
            <button class="new-chat-btn" onclick="createNewChat()">
                <span>+</span> <span id="lbl-new-chat">שיחה חדשה</span>
            </button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-title" id="lbl-recent-chats">שיחות אחרונות</div>
            <div id="sidebar-chats-list"></div>
        </div>
    </aside>

    <div class="app-container">
        <!-- מסך התחברות / הרשמה -->
        <div id="auth-modal" class="auth-container">
            <div class="auth-card">
                <h2 id="auth-title">התחברות ל-MatrixAI</h2>
                <p id="auth-desc">הכנס פרטים כדי להמשיך לשיחות שלך</p>
                
                <input type="text" id="auth-username" class="auth-input" placeholder="שם משתמש">
                <input type="password" id="auth-password" class="auth-input" placeholder="סיסמה">
                
                <button class="auth-btn" onclick="handleAuth()" id="auth-submit-btn">התחבר</button>
                
                <div class="auth-toggle">
                    <span id="auth-toggle-text" onclick="toggleAuthMode()">אין לך חשבון? הרשם בחינם</span>
                </div>
            </div>
        </div>

        <!-- סרגל עליון -->
        <header>
            <div class="header-left">
                <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo">
                    <span style="font-size:1.4rem">🌊</span> MatrixAI Copilot
                </div>
            </div>
            <div class="user-menu">
                <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="he">עברית 🇮🇱</option>
                    <option value="en">English 🇺🇸</option>
                </select>
                <span class="user-badge" id="display-username">אורח</span>
                <button class="logout-btn" onclick="logout()" id="lbl-logout">התנתק</button>
            </div>
        </header>

        <!-- תוכן ראשי (בית) -->
        <main id="home-view">
            <div class="greeting">
                <h1 id="greeting-title">יום טוב</h1>
                <h2 id="greeting-name">במה אוכל לעזור לך היום?</h2>
            </div>

            <div class="search-box-container">
                <input type="text" id="home-input" class="search-box-input" placeholder="שאל שאלה או בקש ליצור תמונה..." onkeydown="if(event.key === 'Enter') startChatFromHome()">
                <div class="search-box-tools">
                    <span class="quick-response-badge" id="lbl-gen-img-btn" onclick="document.getElementById('home-input').value='צור תמונה של '; document.getElementById('home-input').focus();">🖼️ צור תמונה</span>
                    <div class="search-actions">
                        <button class="icon-btn" onclick="startChatFromHome()">➔</button>
                    </div>
                </div>
            </div>

            <div class="suggestions-row" id="suggestions-row">
                <div class="chip" onclick="quickAsk(translations[currentLang].sug1)">מי יצר אותך?</div>
                <div class="chip" onclick="quickAsk(translations[currentLang].sug2)">צור תמונה של חתול בחלל 🎨</div>
                <div class="chip" onclick="quickAsk(translations[currentLang].sug3)">קוד לרובלוקס ב-Luau</div>
                <div class="chip" onclick="quickAsk(translations[currentLang].sug4)">ספר לי בדיחה</div>
            </div>
        </main>

        <!-- מסך שיחה פעילה -->
        <main id="chat-view" class="chat-active-view hidden">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="search-box-container" style="margin-bottom: 0;">
                <input type="text" id="chat-input" class="search-box-input" placeholder="הקלד הודעה..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
                <div class="search-box-tools">
                    <button class="quick-response-badge" id="lbl-back-home" onclick="showHome()">← חזרה לדף הבית</button>
                    <button class="icon-btn" onclick="sendChatMessage()">➔</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = "bgs_live_1ee39ea97e4f175c2c6b4ac63490220f377d43775a56ac30";
        const API_BASE_URL = "https://birgsol-gh.davidyosef2102014.workers.dev/v1";

        let isSignUp = false;
        let currentUser = null;
        let activeChatHistory = [];
        let currentLang = 'he';

        // תרגומים לשפות
        const translations = {
            he: {
                dir: 'rtl',
                title: 'MatrixAI Copilot',
                greetingTitle: 'יום טוב',
                greetingName: 'במה אוכל לעזור לך היום',
                inputPlaceholder: 'שאל שאלה או בקש ליצור תמונה...',
                genImgBtn: '🖼️ צור תמונה',
                newChat: 'שיחה חדשה',
                recentChats: 'שיחות אחרונות',
                logout: 'התנתק',
                backHome: '← חזרה לדף הבית',
                noChats: 'אין שיחות שמורות עדיין',
                sug1: 'מי יצר אותך?',
                sug2: 'צור תמונה של חתול בחלל 🎨',
                sug3: 'תכתוב לי קוד ב-Luau לרובלוקס',
                sug4: 'ספר לי בדיחה',
                authLoginTitle: 'התחברות ל-MatrixAI',
                authSignupTitle: 'הרשמה ל-MatrixAI',
                authLoginDesc: 'הכנס פרטים כדי להמשיך לשיחות שלך',
                authSignupDesc: 'צור חשבון בחינם בשני צעדים',
                authLoginBtn: 'התחבר',
                authSignupBtn: 'הרשם עכשיו',
                authToggleToSignup: 'אין לך חשבון? הרשם בחינם',
                authToggleToLogin: 'כבר יש לך חשבון? התחבר'
            },
            en: {
                dir: 'ltr',
                title: 'MatrixAI Copilot',
                greetingTitle: 'Good day',
                greetingName: 'What can I help you with today',
                inputPlaceholder: 'Ask a question or request an image...',
                genImgBtn: '🖼️ Generate Image',
                newChat: 'New Chat',
                recentChats: 'Recent Chats',
                logout: 'Logout',
                backHome: '← Back to Home',
                noChats: 'No saved chats yet',
                sug1: 'Who created you?',
                sug2: 'Generate an image of a cat in space 🎨',
                sug3: 'Write Luau code for Roblox',
                sug4: 'Tell me a joke',
                authLoginTitle: 'Login to MatrixAI',
                authSignupTitle: 'Sign up for MatrixAI',
                authLoginDesc: 'Enter details to access your chats',
                authSignupDesc: 'Create a free account in two simple steps',
                authLoginBtn: 'Login',
                authSignupBtn: 'Sign Up',
                authToggleToSignup: "Don't have an account? Sign up free",
                authToggleToLogin: 'Already have an account? Login'
            }
        };

        // תארים רנדומליים לאורי ורדיגר
        const oriTitlesHebrew = [
            "אורי ורדיגר המלךךךך",
            "אורי ורדיגר האגדי והאלוף",
            "אורי ורדיגר המאסטר היחיד והמיוחד",
            "אורי ורדיגר תותח העל",
            "אורי ורדיגר המלך הבלתי מעורער"
        ];

        const oriTitlesEnglish = [
            "Ori Vardiger the King!",
            "Ori Vardiger the Legend",
            "Ori Vardiger the Master",
            "Ori Vardiger the Supreme Creator"
        ];

        window.onload = function() {
            const savedUser = localStorage.getItem('copilot_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                setupUserSession();
            }
            updateUI();
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = translations[lang].dir;
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('greeting-title').textContent = t.greetingTitle;
            document.getElementById('greeting-name').textContent = currentUser 
                ? `${t.greetingName}, ${currentUser.username}?` 
                : `${t.greetingName}?`;

            document.getElementById('home-input').placeholder = t.inputPlaceholder;
            document.getElementById('chat-input').placeholder = t.inputPlaceholder;
            document.getElementById('lbl-gen-img-btn').textContent = t.genImgBtn;
            document.getElementById('lbl-new-chat').textContent = t.newChat;
            document.getElementById('lbl-recent-chats').textContent = t.recentChats;
            document.getElementById('lbl-logout').textContent = t.logout;
            document.getElementById('lbl-back-home').textContent = t.backHome;

            // עדכון רכיבי הצעות
            const suggRow = document.getElementById('suggestions-row');
            suggRow.innerHTML = `
                <div class="chip" onclick="quickAsk('${t.sug1}')">${t.sug1}</div>
                <div class="chip" onclick="quickAsk('${t.sug2}')">${t.sug2}</div>
                <div class="chip" onclick="quickAsk('${t.sug3}')">${t.sug3}</div>
                <div class="chip" onclick="quickAsk('${t.sug4}')">${t.sug4}</div>
            `;

            // עדכון טקסט התחברות
            document.getElementById('auth-title').textContent = isSignUp ? t.authSignupTitle : t.authLoginTitle;
            document.getElementById('auth-desc').textContent = isSignUp ? t.authSignupDesc : t.authLoginDesc;
            document.getElementById('auth-submit-btn').textContent = isSignUp ? t.authSignupBtn : t.authLoginBtn;
            document.getElementById('auth-toggle-text').textContent = isSignUp ? t.authToggleToLogin : t.authToggleToSignup;

            loadUserChatsList();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            updateUI();
        }

        function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!username || !password) {
                alert(currentLang === 'he' ? "אנא מלא את כל השדות" : "Please fill in all fields");
                return;
            }

            const users = JSON.parse(localStorage.getItem('copilot_users') || '{}');

            if (isSignUp) {
                if (users[username]) {
                    alert(currentLang === 'he' ? "שם המשתמש כבר קיים!" : "Username already exists!");
                    return;
                }
                users[username] = { password: password, chats: [] };
                localStorage.setItem('copilot_users', JSON.stringify(users));
                currentUser = { username: username };
                localStorage.setItem('copilot_current_user', JSON.stringify(currentUser));
                setupUserSession();
            } else {
                if (!users[username] || users[username].password !== password) {
                    alert(currentLang === 'he' ? "שם משתמש או סיסמה שגויים" : "Invalid username or password");
                    return;
                }
                currentUser = { username: username };
                localStorage.setItem('copilot_current_user', JSON.stringify(currentUser));
                setupUserSession();
            }
        }

        function setupUserSession() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('display-username').textContent = currentUser.username;
            updateUI();
        }

        function logout() {
            localStorage.removeItem('copilot_current_user');
            location.reload();
        }

        function loadUserChatsList() {
            if (!currentUser) return;
            const users = JSON.parse(localStorage.getItem('copilot_users') || '{}');
            const userChats = users[currentUser.username]?.chats || [];
            const container = document.getElementById('sidebar-chats-list');
            container.innerHTML = '';

            if (userChats.length === 0) {
                container.innerHTML = `<span style="color:var(--text-muted); font-size:0.85rem; padding:0.5rem; display:block;">${translations[currentLang].noChats}</span>`;
                return;
            }

            userChats.slice().reverse().forEach((chat) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.onclick = () => openSavedChat(chat);
                item.innerHTML = `<span>💬</span> <span>${chat.title}</span>`;
                container.appendChild(item);
            });
        }

        function createNewChat() {
            activeChatHistory = [];
            document.getElementById('chat-messages').innerHTML = '';
            showHome();
        }

        function quickAsk(text) {
            document.getElementById('home-input').value = text;
            startChatFromHome();
        }

        function startChatFromHome() {
            const text = document.getElementById('home-input').value.trim();
            if (!text) return;

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');

            activeChatHistory = [];
            document.getElementById('chat-messages').innerHTML = '';
            sendChatMessage(text);
        }

        function showHome() {
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            loadUserChatsList();
        }

        async function sendChatMessage(customText) {
            const input = document.getElementById('chat-input');
            const text = customText || input.value.trim();
            if (!text) return;

            if (!customText && input) input.value = '';

            activeChatHistory.push({ role: "user", content: text });
            appendMessage(text, 'user-msg');

            const isImageRequest = text.includes("צור תמונה") || text.toLowerCase().includes("image") || text.toLowerCase().includes("draw") || text.toLowerCase().includes("generate picture");

            const loadingText = currentLang === 'he' ? 'מעבד בקשה...' : 'Processing request...';
            const loadingDiv = appendMessage(loadingText, 'ai-msg');

            try {
                if (isImageRequest) {
                    let imgUrl = null;
                    try {
                        const cleanPrompt = text.replace(/צור תמונה של|תמונה של|generate image of|image of/gi, '').trim();
                        const response = await fetch(API_BASE_URL + '/images/generations', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + API_KEY
                            },
                            body: JSON.stringify({
                                model: "birgsol-image-2",
                                prompt: cleanPrompt || text,
                                size: "1024x1024",
                                n: 1
                            })
                        });
                        const data = await response.json();
                        if (data.data && data.data[0] && data.data[0].url) {
                            imgUrl = data.data[0].url;
                        }
                    } catch (e) {
                        console.log("Server image generation fallback triggered");
                    }

                    if (!imgUrl) {
                        const randomSeed = Math.floor(Math.random() * 1000000);
                        const cleanPrompt = text.replace(/צור תמונה של|תמונה של|generate image of|image of/gi, '').trim();
                        const encodedPrompt = encodeURIComponent(cleanPrompt || text);
                        imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${randomSeed}&nologo=true`;
                    }

                    const captionText = currentLang === 'he' ? 'הנה התמונה שיצרתי עבורך:' : 'Here is the image generated for you:';
                    const downloadText = currentLang === 'he' ? 'הורד תמונה 💾' : 'Download Image 💾';

                    loadingDiv.innerHTML = `
                        ${captionText}<br>
                        <img src="${imgUrl}" alt="Generated Image" crossorigin="anonymous">
                        <br>
                        <a href="${imgUrl}" target="_blank" download="matrixai-image.png" class="download-btn">${downloadText}</a>
                    `;
                    activeChatHistory.push({ role: "assistant", content: "[Image Generated]" });
                    saveCurrentChat();
                } else {
                    // הגדרת תואר רנדומלי לאורי ורדיגר בהתאם לשפה שנבחרה
                    const titlesList = currentLang === 'he' ? oriTitlesHebrew : oriTitlesEnglish;
                    const randomOriTitle = titlesList[Math.floor(Math.random() * titlesList.length)];

                    const systemPromptContent = currentLang === 'he' 
                        ? `אתה עוזר AI חכם ומקצועי. ענה תמיד בשפה שבה הפנו אליך את השאלה (בעברית או באנגלית). אם שואלים אותך מי יצר אותך, מי בנה אותך או מי פיתח אותך (בעברית או באנגלית), ענה בוריאציה הבאה: '${randomOriTitle}'. לעולם אל תזכיר חברות צד שלישי.`
                        : `You are a smart and helpful AI assistant. Always respond in the language the user used (English or Hebrew). If asked who created you, built you, or developed you in any language, answer with: '${randomOriTitle}'. Never mention third-party companies.`;

                    const systemMessages = [
                        { role: "system", content: systemPromptContent },
                        ...activeChatHistory
                    ];

                    const response = await fetch(API_BASE_URL + '/chat/completions', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + API_KEY
                        },
                        body: JSON.stringify({
                            model: "birgsol-3.5-pro",
                            messages: systemMessages
                        })
                    });

                    const data = await response.json();
                    
                    if (data.choices && data.choices[0].message) {
                        const aiReply = data.choices[0].message.content;
                        loadingDiv.textContent = aiReply;
                        activeChatHistory.push({ role: "assistant", content: aiReply });
                        saveCurrentChat();
                    } else if (data.error) {
                        loadingDiv.textContent = (currentLang === 'he' ? "שגיאה מהשרת: " : "Server Error: ") + (data.error.message || JSON.stringify(data.error));
                    } else {
                        loadingDiv.textContent = currentLang === 'he' ? "שגיאה בקבלת התשובה מהשרת" : "Error receiving response from server";
                    }
                }
            } catch (err) {
                loadingDiv.textContent = (currentLang === 'he' ? "שגיאת תקשורת: " : "Connection Error: ") + err.message;
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function saveCurrentChat() {
            if (!currentUser || activeChatHistory.length === 0) return;

            const users = JSON.parse(localStorage.getItem('copilot_users') || '{}');
            if (!users[currentUser.username]) return;

            const chatTitle = activeChatHistory[0].content.substring(0, 25) + '...';
            const userChats = users[currentUser.username].chats || [];
            
            // עדכון שיחה קיימת או פתיחת שיחה חדשה
            const existingIndex = userChats.findIndex(c => c.title === chatTitle);
            if (existingIndex >= 0) {
                userChats[existingIndex].history = activeChatHistory;
            } else {
                userChats.push({ title: chatTitle, history: activeChatHistory });
            }

            users[currentUser.username].chats = userChats;
            localStorage.setItem('copilot_users', JSON.stringify(users));
            loadUserChatsList();
        }

        function openSavedChat(chat) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');

            activeChatHistory = chat.history;
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            activeChatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    appendMessage(msg.content, 'user-msg');
                } else {
                    appendMessage(msg.content, 'ai-msg');
                }
            });
        }
    </script>
</body>
</html>
