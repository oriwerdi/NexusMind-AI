<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Web App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 1.25rem;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-start;
        }
        .ai-message {
            background-color: var(--card-bg);
            color: var(--text-color);
            align-self: flex-end;
            border: 1px solid #334155;
        }
        #input-container {
            background-color: var(--card-bg);
            padding: 1rem;
            border-top: 1px solid #334155;
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>🤖 My AI Assistant</header>

    <div id="chat-container">
        <div class="message ai-message">אהלן! הקלד הודעה למטה כדי להתחיל לדבר עם הבינה המלאכותית.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="הקלד את ההודעה שלך כאן..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">שלח</button>
    </div>

    <script>
        // הגדרות הגישה החדשות
        const API_KEY = "bgs_live_1ee39ea97e4f175c2c6b4ac63490220f377d43775a56ac30";
        const API_BASE_URL = "https://birgsol-gh.davidyosef2102014.workers.dev/v1";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();

            if (!userText) return;

            // הצגת הודעת המשתמש
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = userText;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // הודעת טעינה
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'חושב...';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // ביצוע קריאת ה-API לכתובת ה-Worker שהגדרת
                const response = await fetch(API_BASE_URL + '/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
body: JSON.stringify({
    model: "birgsol-3.5-pro", // שונה למודל המדויק מתוך הרשימה של BIRGSOL
    messages: [{ role: "user", content: userText }]
})
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0].message && data.choices[0].message.content) {
                    aiMsgDiv.textContent = data.choices[0].message.content;
                } else if (data.error) {
                    aiMsgDiv.textContent = "שגיאה מהשרת: " + (data.error.message || JSON.stringify(data.error));
                } else {
                    aiMsgDiv.textContent = "תשובה התקבלה במבנה לא צפוי.";
                }
            } catch (error) {
                aiMsgDiv.textContent = "שגיאת תקשורת מול השרת: " + error.message;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
